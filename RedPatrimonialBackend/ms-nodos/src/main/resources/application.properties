spring.application.name=ms-nodos
server.port=8082

# Base de datos LOCAL en archivo: se crea sola en la carpeta ./data al iniciar.
# No requiere instalar MySQL ni Oracle.
spring.datasource.url=jdbc:h2:file:./data/ms-nodos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web de la base de datos: http://localhost:8082/h2-console
# (JDBC URL: jdbc:h2:file:./data/ms-nodos  usuario: sa  sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Documentación Swagger: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.serialization.write-dates-as-timestamps=false
