spring.application.name=ms-usuarios
server.port=8081

# Base de datos LOCAL en archivo: se crea sola en la carpeta ./data al iniciar.
# No requiere instalar MySQL ni Oracle.
spring.datasource.url=jdbc:h2:file:./data/ms-usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web de la base de datos: http://localhost:8081/h2-console
# (JDBC URL: jdbc:h2:file:./data/ms-usuarios  usuario: sa  sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Documentación Swagger: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.serialization.write-dates-as-timestamps=false
